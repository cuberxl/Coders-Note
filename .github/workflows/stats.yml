name: stats

on:
  push:
    branches: [master]
    paths:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate stats.html
        run: node .github/scripts/gen-stats.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.html
          if git diff --staged --quiet; then
            echo "统计无变化，跳过提交"
          else
            git commit -m "chore: 更新笔记用量统计 [skip ci]"
            git push
          fi
