# 网站基本信息
title: "Coders-Note"
description: "编程学习笔记"
lang: "zh-CN"
url: "https://cuberxl.github.io"
baseurl: "/Coders-Note"
timezone: "Asia/Shanghai"

# 主题
theme: jekyll-theme-primer

# 文章链接格式
permalink: /:categories/:title/

# Markdown 与代码高亮
markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  math_engine: mathjax
  syntax_highlighter: rouge
  parse_block_html: true

# GitHub Pages 支持的常用插件
plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

# Mermaid：这是自定义配置项，需由页面模板或脚本读取
mermaid: true

# 不发布这些文件
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
