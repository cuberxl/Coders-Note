title: "Coders-Note"
description: "编程学习笔记"
lang: "zh-CN"
url: "https://cuberxl.github.io"
baseurl: "/Coders-Note"
timezone: "Asia/Shanghai"

theme: jekyll-theme-primer

permalink: /:categories/:title/

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  math_engine: mathjax
  syntax_highlighter: rouge
  parse_block_html: true

plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

mermaid: true

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
