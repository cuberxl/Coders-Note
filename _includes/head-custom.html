<!-- Mermaid 库 -->
<script
  src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"
  defer>
</script>

<!-- Mermaid 与折叠代码的样式 -->
<style>
  .markdown-body .mermaid {
    box-sizing: border-box;
    margin: 1.5rem 0;
    padding: 1.25rem;
    overflow-x: auto;
    text-align: center;
    background: #f8fbff;
    border: 1px solid #d6e4ff;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.04);
  }

  .markdown-body .mermaid svg {
    display: block;
    max-width: 100%;
    height: auto;
    margin: 0 auto;
  }

  .markdown-body .mermaid .node rect {
    fill: #eaf2ff !important;
    stroke: #1e40af !important;
    stroke-width: 1.5px !important;
  }

  .markdown-body .mermaid .nodeLabel,
  .markdown-body .mermaid .label {
    color: #1e3a8a !important;
    fill: #1e3a8a !important;
  }

  .markdown-body .mermaid .edgePath .path {
    stroke: #1e40af !important;
    stroke-width: 2px;
  }

  .markdown-body .mermaid marker path {
    fill: #1e40af !important;
    stroke: #1e40af !important;
  }

  .markdown-body details.collapsible-code {
    margin: 1rem 0;
    overflow: hidden;
    border: 1px solid #d8dee8;
  }

  .markdown-body details.collapsible-code > summary {
    padding: 0.65rem 1rem;
    cursor: pointer;
    color: #334155;
    background: #f1f5f9;
    font-weight: 600;
  }

  .markdown-body details.collapsible-code[open] > summary {
    border-bottom: 1px solid #d8dee8;
  }

  .markdown-body details.collapsible-code pre {
    margin: 0;
  }
</style>

<!-- Mermaid 代码块转换与渲染 -->
<script>
  document.addEventListener('DOMContentLoaded', async function () {
    const mermaidBlocks = Array.from(
      document.querySelectorAll('.language-mermaid')
    ).filter(function (element) {
      return !element.parentElement ||
        !element.parentElement.closest('.language-mermaid');
    });

    mermaidBlocks.forEach(function (block) {
      const container =
        block.closest('.highlighter-rouge') ||
        block.closest('pre') ||
        block;

      const source =
        container.querySelector('pre code') ||
        (block.matches('code') ? block : null) ||
        block;

      const diagram = document.createElement('div');
      diagram.className = 'mermaid';
      diagram.textContent = source.textContent.trim();

      container.replaceWith(diagram);
    });

    const diagrams = document.querySelectorAll(
      '.markdown-body .mermaid'
    );

    if (diagrams.length === 0) return;

    if (!window.mermaid) {
      console.error('Mermaid 加载失败，请检查 CDN 或网络连接。');
      return;
    }

    window.mermaid.initialize({
      startOnLoad: false,
      theme: 'base',
      securityLevel: 'strict',
      themeVariables: {
        fontFamily: 'system-ui, -apple-system, "Segoe UI", sans-serif',
        fontSize: '16px',
        background: '#f8fbff',
        primaryColor: '#eaf2ff',
        primaryTextColor: '#1e3a8a',
        primaryBorderColor: '#1e40af',
        lineColor: '#1e40af',
        secondaryColor: '#eaf2ff',
        tertiaryColor: '#eaf2ff',
        edgeLabelBackground: '#ffffff'
      },
      flowchart: {
        curve: 'basis',
        nodeSpacing: 45,
        rankSpacing: 60,
        padding: 16
      }
    });

    try {
      await window.mermaid.run({ nodes: diagrams });
    } catch (error) {
      console.error('Mermaid 图表渲染失败：', error);
    }
  });
</script>

<!-- 只负责折叠 C++ 代码块 -->
<script src="{{ '/assets/js/collapsible-code.js' | relative_url }}" defer></script>
