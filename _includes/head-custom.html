<script>
  window.MathJax = {
    tex: {
      inlineMath: [
        ['$', '$'],
        ['\\(', '\\)']
      ],
      displayMath: [
        ['$$', '$$'],
        ['\\[', '\\]']
      ],
      processEscapes: true
    },
    options: {
      skipHtmlTags: [
        'script',
        'noscript',
        'style',
        'textarea',
        'pre',
        'code'
      ]
    }
  };
</script>

<script
  id="MathJax-script"
  async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>

<script
  src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"
  defer>
</script>

<script>
  document.addEventListener('DOMContentLoaded', async function () {
    /*
     * Rouge/Kramdown 可能把 language-mermaid 类放在外层 div，
     * 也可能放在 code 元素上。选择最外层匹配元素，避免重复处理。
     */
    const mermaidBlocks = Array.from(
      document.querySelectorAll('.language-mermaid')
    ).filter(function (element) {
      return !element.parentElement ||
        !element.parentElement.closest('.language-mermaid');
    });

    mermaidBlocks.forEach(function (block) {
      const container =
        block.closest('.highlighter-rouge') ||
        block.closest('pre') ||
        block;

      const source =
        container.querySelector('pre code') ||
        (block.matches('code') ? block : null) ||
        block;

      const diagram = document.createElement('div');
      diagram.className = 'mermaid';
      diagram.textContent = source.textContent.trim();

      container.replaceWith(diagram);
    });

    if (!window.mermaid) {
      console.error('Mermaid 加载失败，请检查 CDN 或网络连接。');
      return;
    }

    const diagrams = document.querySelectorAll('.mermaid');

    if (diagrams.length === 0) {
      return;
    }

    window.mermaid.initialize({
      startOnLoad: false,
      theme: 'default',
      securityLevel: 'strict'
    });

    try {
      await window.mermaid.run({
        nodes: diagrams
      });
    } catch (error) {
      console.error('Mermaid 图表渲染失败：', error);
    }
  });
</script>
