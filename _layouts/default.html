<!DOCTYPE html>
<html lang="{{ site.lang | default: "zh-CN" }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title | default: "C++ 算法学习笔记" }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    
    <!-- MathJax 公式渲染（全局开启） -->
    <script>
    window.MathJax = {
        tex: {
            inlineMath: [['$', '$'], ['\\(', '\\)']],
            displayMath: [['$$', '$$'], ['\\[', '\\]']],
            processEscapes: true
        }
    };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
    <div class="wrapper">
        <header>
            <h1><a href="{{ '/' | relative_url }}">{{ site.title | default: "C++ 算法学习笔记" }}</a></h1>
            <p>{{ site.description | default: "个人算法学习笔记" }}</p>
        </header>
        <section>
            {{ content }}
        </section>
        <footer>
            <p><small>Hosted on GitHub Pages</small></p>
        </footer>
    </div>
</body>
</html>
